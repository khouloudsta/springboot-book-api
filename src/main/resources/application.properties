spring.application.name=book-api
management.endpoints.web.exposure.include=mappings,health

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookdb}
spring.datasource.username=${DB_USERNAME:bookuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger