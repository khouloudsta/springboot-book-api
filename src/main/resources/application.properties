spring.application.name=book-api
management.endpoints.web.exposure.include=mappings,health

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookdb}
spring.datasource.username=${DB_USERNAME:bookuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Validates the schema; Flyway manages schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Enables versioned database migrations.
spring.flyway.enabled=true

# Allows adopting the existing development schema when explicitly enabled.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger